{{- if and .Values.postgres.enabled (not .Values.postgres.externalSecret.enabled) }}
{{- /*
  Dev-only plain credentials secret. Used when ExternalSecret is disabled
  (e.g. local Tilt). In production, prefer externalSecret.enabled=true so
  credentials come from Vault.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.credentialsSecret }}
  labels:
    {{- include "comdirect-firefly-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.owner | default "finance" | quote }}
  password: {{ .Values.postgres.devPassword | default "dev_password_change_me" | quote }}
  uri: "postgresql://{{ .Values.postgres.owner | default "finance" }}:{{ .Values.postgres.devPassword | default "dev_password_change_me" }}@{{ include "comdirect-firefly-sync.fullname" . }}-postgres-rw:5432/{{ .Values.postgres.db | default "finance" }}"
{{- end }}
