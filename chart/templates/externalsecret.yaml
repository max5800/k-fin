{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "k-fin.fullname" . }}-comdirect-secrets
  labels:
    {{- include "k-fin.labels" . | nindent 4 }}
    app.kubernetes.io/component: export
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore.name }}
    kind: {{ .Values.externalSecret.secretStore.kind }}
  target:
    name: {{ include "k-fin.fullname" . }}-comdirect-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.keys }}
    - secretKey: {{ .envVar }}
      remoteRef:
        key: {{ .path | default $.Values.externalSecret.vaultPath }}
        property: {{ .vaultKey }}
    {{- end }}
---
# Infrastructure secrets — via ClusterSecretStore (k8s/* path)
# Contains API_TOKEN, ANTHROPIC_API_KEY, and any future infra keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "k-fin.fullname" . }}-infra-secrets
  labels:
    {{- include "k-fin.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.infraSecrets.secretStore.name }}
    kind: {{ .Values.externalSecret.infraSecrets.secretStore.kind }}
  target:
    name: {{ include "k-fin.fullname" . }}-infra-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.infraSecrets.keys }}
    - secretKey: {{ .envVar }}
      remoteRef:
        key: {{ .path }}
        property: {{ .vaultKey }}
    {{- end }}
{{- end }}
