{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "comdirect-firefly-sync.fullname" . }}-secrets
  labels:
    {{- include "comdirect-firefly-sync.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore.name }}
    kind: {{ .Values.externalSecret.secretStore.kind }}
  target:
    name: {{ include "comdirect-firefly-sync.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.keys }}
    - secretKey: {{ .envVar }}
      remoteRef:
        key: {{ $.Values.externalSecret.vaultPath }}
        property: {{ .vaultKey }}
    {{- end }}
{{- end }}
