{{- if and .Values.postgres.enabled .Values.postgres.backup.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "comdirect-firefly-sync.fullname" . }}-postgres-nightly
  labels:
    {{- include "comdirect-firefly-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-backup
spec:
  schedule: {{ .Values.postgres.backup.schedule | default "0 0 2 * * *" | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ include "comdirect-firefly-sync.fullname" . }}-postgres
{{- end }}
