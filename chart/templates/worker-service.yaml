apiVersion: v1
kind: Service
metadata:
  name: {{ include "k-fin.fullname" . }}-worker
  labels:
    {{- include "k-fin.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    {{- include "k-fin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
