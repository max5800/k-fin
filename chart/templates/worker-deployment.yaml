apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k-fin.fullname" . }}-worker
  labels:
    {{- include "k-fin.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "k-fin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "k-fin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: migrate
          image: "{{ .Values.postgres.migrate.image.repository | default .Values.worker.image.repository }}:{{ .Values.postgres.migrate.image.tag | default .Values.worker.image.tag | default (printf "v%s" .Chart.Version) }}"
          imagePullPolicy: {{ .Values.postgres.migrate.image.pullPolicy | default .Values.worker.image.pullPolicy }}
          command: ["uv", "run", "python", "scripts/migrate.py"]
          securityContext:
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret }}
                  key: uri
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default (printf "v%s" .Chart.Version) }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          {{- if .Values.worker.command }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          {{- else }}
          command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
          {{- end }}
          ports:
            - containerPort: 8001
              protocol: TCP
          env:
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret }}
                  key: uri
            {{- end }}
            {{- range $key, $value := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "k-fin.fullname" . }}-comdirect-secrets
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: exports
              mountPath: /data/exports
            {{- end }}
          securityContext:
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: exports
          persistentVolumeClaim:
            claimName: {{ include "k-fin.fullname" . }}-exports
        {{- end }}
