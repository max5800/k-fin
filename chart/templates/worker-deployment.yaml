apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k-fin.fullname" . }}-worker
  labels:
    {{- include "k-fin.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    # Roll the deployment when the referenced infra-secrets / comdirect
    # secret changes (e.g. ESO syncs a rotated Vault key). Requires the
    # Stakater Reloader operator in-cluster — no-op without it.
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "k-fin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "k-fin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default (printf "v%s" .Chart.Version) }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          {{- if .Values.worker.command }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          {{- else }}
          command: ["/app/.venv/bin/uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
          {{- end }}
          ports:
            - containerPort: 8001
              protocol: TCP
          env:
            - name: PYTHONPATH
              value: /app
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret }}
                  key: uri
            {{- end }}
            {{- range $key, $value := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "k-fin.fullname" . }}-comdirect-secrets
            - secretRef:
                name: {{ include "k-fin.fullname" . }}-infra-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: exports
              mountPath: /data/exports
            {{- end }}
          securityContext:
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          # Startup probe gates Ready until the boot reaper finishes.
          # 30 × 5s = 150s max grace before liveness takes over.
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: exports
          persistentVolumeClaim:
            claimName: {{ include "k-fin.fullname" . }}-exports
        {{- end }}
