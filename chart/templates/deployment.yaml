apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "comdirect-firefly-sync.fullname" . }}
  labels:
    {{- include "comdirect-firefly-sync.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "comdirect-firefly-sync.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "comdirect-firefly-sync.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "comdirect-firefly-sync.fullname" . }}-secrets
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: exports
              mountPath: /data/exports
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: exports
          persistentVolumeClaim:
            claimName: {{ include "comdirect-firefly-sync.fullname" . }}-exports
        {{- end }}
