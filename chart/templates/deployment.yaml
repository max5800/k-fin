apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k-fin.fullname" . }}-api
  labels:
    {{- include "k-fin.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "k-fin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "k-fin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default (printf "v%s" .Chart.Version) }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- if .Values.api.command }}
          command:
            {{- toYaml .Values.api.command | nindent 12 }}
          {{- else }}
          command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
          {{- end }}
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: PYTHONPATH
              value: /app
            - name: WORKER_URL
              value: "http://{{ include "k-fin.fullname" . }}-worker:8001"
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "k-fin.fullname" . }}-infra-secrets
                  key: API_TOKEN
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "k-fin.fullname" . }}-infra-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            # DEV ONLY — bootstrap login password. Optional so the pod
            # still rolls if the Vault key is missing; the auth router
            # 500s gracefully in that case. APP_ENV must be "development"
            # AND BOOTSTRAP_LOGIN_ENABLED=true for the endpoint to respond.
            - name: BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "k-fin.fullname" . }}-infra-secrets
                  key: BOOTSTRAP_PASSWORD
                  optional: true
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret }}
                  key: uri
            {{- end }}
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "k-fin.fullname" . }}-infra-secrets
                optional: true
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: exports
              mountPath: /data/exports
              readOnly: true
            {{- end }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: exports
          persistentVolumeClaim:
            claimName: {{ include "k-fin.fullname" . }}-exports
        {{- end }}
