{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k-fin.fullname" . }}-ui
  labels:
    {{- include "k-fin.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "k-fin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "k-fin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default (printf "v%s" .Chart.Version) }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          {{- if .Values.ui.command }}
          command:
            {{- toYaml .Values.ui.command | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: VITE_API_PROXY_TARGET
              value: "http://{{ include "k-fin.fullname" . }}-api:{{ .Values.service.port }}"
            {{- range $key, $value := .Values.ui.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
{{- end }}
