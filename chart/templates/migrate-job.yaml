{{- if .Values.postgres.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "k-fin.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "k-fin.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.postgres.migrate.image.repository | default .Values.worker.image.repository }}:{{ .Values.postgres.migrate.image.tag | default .Values.worker.image.tag | default (printf "v%s" .Chart.Version) }}"
          imagePullPolicy: {{ .Values.postgres.migrate.image.pullPolicy | default .Values.worker.image.pullPolicy }}
          command: ["/app/.venv/bin/python", "scripts/migrate.py"]
          securityContext:
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
          env:
            - name: UV_CACHE_DIR
              value: /tmp/.cache/uv
            - name: PYTHONPATH
              value: /app
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret }}
                  key: uri
            # Bootstrap user seed (consumed by migration 0013_users).
            # Optional: if the Vault keys are missing, the migration
            # silently skips the INSERT and no user is seeded.
            - name: BOOTSTRAP_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "k-fin.fullname" . }}-infra-secrets
                  key: BOOTSTRAP_USER_EMAIL
                  optional: true
            - name: BOOTSTRAP_USER_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "k-fin.fullname" . }}-infra-secrets
                  key: BOOTSTRAP_USER_INITIAL_PASSWORD
                  optional: true
            - name: BOOTSTRAP_USER_DISPLAY_NAME
              value: {{ .Values.api.env.BOOTSTRAP_USER_DISPLAY_NAME | default "Max" | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
