apiVersion: v1
kind: Service
metadata:
  name: {{ include "k-fin.fullname" . }}-api
  labels:
    {{- include "k-fin.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "k-fin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
