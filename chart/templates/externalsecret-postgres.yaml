{{- if and .Values.postgres.enabled .Values.postgres.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.credentialsSecret }}
  labels:
    {{- include "comdirect-firefly-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  refreshInterval: {{ .Values.postgres.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.postgres.externalSecret.secretStore.name }}
    kind: {{ .Values.postgres.externalSecret.secretStore.kind }}
  target:
    name: {{ .Values.postgres.credentialsSecret }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
        uri: "postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ include "comdirect-firefly-sync.fullname" . }}-postgres-rw:5432/{{ .Values.postgres.db | default "finance" }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.postgres.externalSecret.vaultPath }}
        property: POSTGRES_USER
    - secretKey: password
      remoteRef:
        key: {{ .Values.postgres.externalSecret.vaultPath }}
        property: POSTGRES_PASSWORD
{{- if .Values.postgres.backup.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.backup.credentialsSecret }}
  labels:
    {{- include "comdirect-firefly-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-backup
spec:
  refreshInterval: {{ .Values.postgres.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.postgres.externalSecret.secretStore.name }}
    kind: {{ .Values.postgres.externalSecret.secretStore.kind }}
  target:
    name: {{ .Values.postgres.backup.credentialsSecret }}
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.postgres.externalSecret.vaultPath }}
        property: S3_ACCESS_KEY_ID
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.postgres.externalSecret.vaultPath }}
        property: S3_SECRET_ACCESS_KEY
{{- end }}
{{- end }}
