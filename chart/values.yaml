image:
  repository: ghcr.io/max5800/comdirect-firefly-sync
  tag: latest
  pullPolicy: IfNotPresent

# --- Read-only API (always-on) ---
api:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  env:
    APP_ENV: "production"
    LOG_LEVEL: "INFO"
    EXPORTS_DIR: "/data/exports"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: traefik
  host: comdirect-sync.local
  annotations: {}

# --- Export job (manually triggered, security-sensitive) ---
exportJob:
  enabled: true
  backoffLimit: 0
  env:
    EXPORTS_DIR: "/data/exports"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# --- ExternalSecret for Comdirect credentials (export job only) ---
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore
  vaultPath: secret/data/finance/comdirect
  # Keys mapped from Vault into the K8s Secret
  keys:
    - vaultKey: comdirect-client-id
      envVar: COMDIRECT_CLIENT_ID
    - vaultKey: comdirect-client-secret
      envVar: COMDIRECT_CLIENT_SECRET
    - vaultKey: comdirect-username
      envVar: COMDIRECT_USERNAME
    - vaultKey: comdirect-pin
      envVar: COMDIRECT_PIN
