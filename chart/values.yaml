# --- Read-only API (always-on, lean image, no bank secrets) ---
api:
  image:
    repository: ghcr.io/max5800/k-fin-api
    # Defaults to v<Chart.Version> when empty
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1001
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  env:
    APP_ENV: "production"
    LOG_LEVEL: "INFO"
    EXPORTS_DIR: "/data/exports"
    # Bootstrap login — DEV ONLY. Hard-disabled when APP_ENV=production
    # (the auth router 404s regardless of this flag), so leaving it false
    # here is just defence-in-depth for the chart default.
    BOOTSTRAP_LOGIN_ENABLED: "false"
    BOOTSTRAP_EMAIL: ""
    # CORS origins — comma-separated. Empty omits the middleware entirely.
    # Override per-environment in dev/values.remote.yaml.
    CORS_ORIGINS: ""

service:
  type: ClusterIP
  port: 8000

# --- Frontend (Vite dev-server; read-only, no secrets) ---
ui:
  enabled: true
  image:
    repository: ghcr.io/max5800/k-fin-ui
    # UI is released from a separate repo (k-fin-ui) with its own
    # semantic-release cadence, so the tag is NOT tied to Chart.Version.
    # Bump this manually when a new UI image is published to GHCR.
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    # Relative path so the browser talks to the same origin;
    # Ingress or Vite-proxy routes /api/* to the API service.
    VITE_API_BASE_URL: "/api/v1"

ingress:
  enabled: true
  className: traefik
  host: k-fin.local
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# --- Internal worker (security-sensitive, has bank credentials) ---
worker:
  image:
    repository: ghcr.io/max5800/k-fin-worker
    # Defaults to v<Chart.Version> when empty
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1001
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  env:
    EXPORTS_DIR: "/data/exports"
    ACCOUNT_TRANSACTION_LIMIT: "500"
    # Depot: 2-year window + max paging so the trailing-12M dividend KPI has
    # enough booking history to be accurate. paging-count for the depot
    # transactions endpoint caps at 500 (Comdirect rejects higher with 422).
    DEPOT_TRANSACTION_LIMIT: "500"
    DEPOT_TRANSACTION_MIN_BOOKING_DATE: "-730d"
    # Worker also mounts the auth router, so it needs the same APP_ENV
    # and bootstrap knobs as the api. Defaults are production-safe.
    APP_ENV: "production"
    BOOTSTRAP_LOGIN_ENABLED: "false"
    BOOTSTRAP_EMAIL: ""
    CORS_ORIGINS: ""
    # Optional examples:
    # ACCOUNT_TRANSACTION_MIN_BOOKING_DATE: "-90d"

imagePullSecrets: []

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# --- ExternalSecret for Comdirect credentials (worker only) ---
#
# Secret Access Split:
#   Bank credentials (finance/comdirect) → vault-finance SecretStore (eso-comdirect role)
#   Infrastructure secrets (k8s/*) → vault-backend ClusterSecretStore (eso-reader role)
#
# The eso-comdirect Vault role is scoped to secret/data/finance/* only.
# API token and Postgres credentials live under k8s/* and must use the
# cluster-wide eso-reader role via vault-backend ClusterSecretStore.
#
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore
  # Default path, individual keys can override via `path`
  vaultPath: k8s/finance-api
  # Keys mapped from Vault into the K8s Secret
  keys:
    - path: finance/comdirect
      vaultKey: COMDIRECT_CLIENT_ID
      envVar: COMDIRECT_CLIENT_ID
    - path: finance/comdirect
      vaultKey: COMDIRECT_CLIENT_SECRET
      envVar: COMDIRECT_CLIENT_SECRET
    - path: finance/comdirect
      vaultKey: COMDIRECT_USERNAME
      envVar: COMDIRECT_USERNAME
    - path: finance/comdirect
      vaultKey: COMDIRECT_PIN
      envVar: COMDIRECT_PIN
  # Infrastructure secrets — via ClusterSecretStore (k8s/* path)
  # API token, Anthropic API key, and any future infra keys
  #
  # BOOTSTRAP_PASSWORD lives here because it grants access to API_TOKEN
  # (the bootstrap login endpoint returns it on success). Even though it's
  # a DEV ONLY credential, it's not inert, so we keep it out of values.yaml
  # and pull it from Vault next to the token it unlocks. The deployment
  # makes this ref optional, so the pod still rolls if the Vault key is
  # missing (the endpoint will then 500 with "misconfigured" until the
  # operator writes the value to k8s/finance-api).
  infraSecrets:
    secretStore:
      name: vault-backend
      kind: ClusterSecretStore
    keys:
      - path: k8s/finance-api
        vaultKey: API_TOKEN
        envVar: API_TOKEN
      - path: k8s/finance-api
        vaultKey: ANTHROPIC_API_KEY
        envVar: ANTHROPIC_API_KEY
      - path: k8s/finance-api
        vaultKey: BOOTSTRAP_PASSWORD
        envVar: BOOTSTRAP_PASSWORD

# --- Postgres (CloudNativePG) ---
postgres:
  enabled: true
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:16.4
  db: finance
  owner: finance
  credentialsSecret: k-fin-postgres-credentials
  persistence:
    size: 10Gi
    storageClass: ""
  resources: {}
  monitoring: {}
  backup:
    enabled: true
    retentionPolicy: "7d"
    schedule: "0 0 2 * * *"
    destinationPath: "s3://postgres-backups/finance"
    endpointURL: "https://s3.max5800.com"
    credentialsSecret: k-fin-postgres-backup-s3
  externalSecret:
    enabled: true
    refreshInterval: 1h
    secretStore:
      name: vault-backend
      kind: ClusterSecretStore
    vaultPath: k8s/finance-postgres
  migrate:
    image:
      repository: ""
      tag: ""
      pullPolicy: ""
