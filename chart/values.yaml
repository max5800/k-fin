# --- Read-only API (always-on, lean image, no bank secrets) ---
api:
  image:
    repository: ghcr.io/max5800/k-fin-api
    # Defaults to v<Chart.Version> when empty
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1001
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  env:
    APP_ENV: "production"
    LOG_LEVEL: "INFO"
    EXPORTS_DIR: "/data/exports"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: traefik
  host: k-fin.local
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# --- Internal worker (security-sensitive, has bank credentials) ---
worker:
  image:
    repository: ghcr.io/max5800/k-fin-worker
    # Defaults to v<Chart.Version> when empty
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1001
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  env:
    EXPORTS_DIR: "/data/exports"
    ACCOUNT_TRANSACTION_LIMIT: "500"
    DEPOT_TRANSACTION_LIMIT: "100"
    # Optional examples:
    # ACCOUNT_TRANSACTION_MIN_BOOKING_DATE: "-90d"
    # DEPOT_TRANSACTION_MIN_BOOKING_DATE: "-180d"

imagePullSecrets: []

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# --- ExternalSecret for Comdirect credentials (worker only) ---
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore
  # Default path, individual keys can override via `path`
  vaultPath: k8s/finance-api
  # Keys mapped from Vault into the K8s Secret
  keys:
    - path: finance/comdirect
      vaultKey: COMDIRECT_CLIENT_ID
      envVar: COMDIRECT_CLIENT_ID
    - path: finance/comdirect
      vaultKey: COMDIRECT_CLIENT_SECRET
      envVar: COMDIRECT_CLIENT_SECRET
    - path: finance/comdirect
      vaultKey: COMDIRECT_USERNAME
      envVar: COMDIRECT_USERNAME
    - path: finance/comdirect
      vaultKey: COMDIRECT_PIN
      envVar: COMDIRECT_PIN
    - path: k8s/finance-api
      vaultKey: API_TOKEN
      envVar: API_TOKEN

# --- Postgres (CloudNativePG) ---
postgres:
  enabled: true
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:16.4
  db: finance
  owner: finance
  credentialsSecret: k-fin-postgres-credentials
  persistence:
    size: 10Gi
    storageClass: ""
  resources: {}
  monitoring: {}
  backup:
    enabled: true
    retentionPolicy: "7d"
    schedule: "0 0 2 * * *"
    destinationPath: "s3://postgres-backups/finance"
    endpointURL: "https://s3.max5800.com"
    credentialsSecret: k-fin-postgres-backup-s3
  externalSecret:
    enabled: true
    refreshInterval: 1h
    secretStore:
      name: vault-backend
      kind: ClusterSecretStore
    vaultPath: k8s/finance-postgres
  migrate:
    image:
      repository: ""
      tag: ""
      pullPolicy: ""
