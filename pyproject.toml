[project]
name = "k-fin"
version = "0.1.0"
description = "K-Fin — Personal Finance Intelligence Platform"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pandas>=2.2.0",
    "pydantic-ai-slim[anthropic]>=0.1.80",
    "mcp>=1.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "yfinance>=0.2.50",
    "python-multipart>=0.0.26",
]

[project.scripts]
k-fin-mcp = "src.mcp_server.__main__:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "testcontainers[postgres]>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
