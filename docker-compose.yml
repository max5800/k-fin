services:
  # ── Internal Worker ───────────────────────────────────────
  # Holt Daten von der Comdirect API und schreibt CSVs.
  # Hat Zugang zu .env (Credentials). Nur intern erreichbar.
  worker:
    build: .
    container_name: comdirect-worker
    env_file: .env
    environment:
      - EXPORTS_DIR=/data/exports
    ports:
      - "8001:8001"
    volumes:
      - export-data:/data/exports
    restart: unless-stopped

  # ── Read-Only API ─────────────────────────────────────────
  # Stellt exportierte CSVs über REST bereit.
  # KEIN Zugang zu .env oder Comdirect-Credentials.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: comdirect-api
    ports:
      - "8420:8000"
    environment:
      - EXPORTS_DIR=/data/exports
      - WORKER_URL=http://worker:8001
      # Optional: API-Token setzen für Zugriffskontrolle
      # - API_TOKEN=dein-geheimer-token
    volumes:
      - export-data:/data/exports:ro
    depends_on:
      - worker
    restart: unless-stopped

volumes:
  export-data:
