name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        env:
          # Dummy key — pydantic-ai validates presence at import time, but no
          # real LLM calls happen in tests (agents are overridden with TestModel).
          ANTHROPIC_API_KEY: dummy-for-tests
        run: uv run pytest --tb=short

  test-migrations:
    name: Migration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Run all migrations
        env:
          DATABASE_URL: postgresql+psycopg://finance:testpassword@localhost:5432/finance
        run: uv run python scripts/migrate.py

      - name: Verify HEAD revision
        env:
          DATABASE_URL: postgresql+psycopg://finance:testpassword@localhost:5432/finance
        run: uv run alembic current 2>&1 | grep -q "(head)"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build export image
        run: docker build -t comdirect-export .

      - name: Build API image
        run: docker build -f Dockerfile.api -t comdirect-api .
