name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        env:
          # Dummy key — pydantic-ai validates presence at import time, but no
          # real LLM calls happen in tests (agents are overridden with TestModel).
          ANTHROPIC_API_KEY: dummy-for-tests
        run: uv run pytest --tb=short

  test-migrations:
    name: Migration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run all migrations
        env:
          DATABASE_URL: postgresql+psycopg://finance:testpassword@localhost:5432/finance
        run: uv run python scripts/migrate.py

      - name: Verify HEAD revision
        env:
          DATABASE_URL: postgresql+psycopg://finance:testpassword@localhost:5432/finance
        run: uv run alembic current 2>&1 | grep -q "(head)"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build worker image
        run: docker build -t comdirect-export .

      - name: Build API image
        run: docker build -f Dockerfile.api -t comdirect-api .

      # Smoke-test the import graph inside each image. `docker build` only
      # checks that COPY paths exist; it never runs Python. A future stream
      # that adds a new src/<X>/ package and forgets to COPY it ships a
      # CrashLoopBackOff to prod. These two `python -c "import ..."` lines
      # boot just enough to fail the workflow when that happens.
      - name: Smoke-import API image
        run: |
          docker run --rm --entrypoint python comdirect-api \
            -c "import src.api.app"

      - name: Smoke-import worker image
        env:
          # pydantic-ai validates Anthropic provider creds at import time.
          # No real LLM calls are made — we only walk the import graph.
          ANTHROPIC_API_KEY: dummy-for-smoke-test
        run: |
          docker run --rm \
            -e ANTHROPIC_API_KEY \
            --entrypoint /app/.venv/bin/python comdirect-export \
            -c "import main"
