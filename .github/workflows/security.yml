name: Security

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks-action needs full history to scan PR commit ranges
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Custom rules + allowlists tuned for k-fin
          GITLEAKS_CONFIG: .gitleaks.toml
          # No GITLEAKS_LICENSE — only required for org accounts.

  dependency-audit:
    name: Dependency CVE audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Export locked requirements and run pip-audit
        # The export is the frozen runtime closure from uv.lock. Because every
        # requirement is pinned and hashed, pip-audit can query it directly
        # without creating a temporary pip environment. pipefail also makes an
        # export failure fail the job instead of auditing an empty stream.
        run: |
          set -o pipefail
          uv export --frozen --no-dev --format requirements-txt --no-emit-project |
            uvx pip-audit --disable-pip --require-hashes -r /dev/stdin
