name: Security

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks-action needs full history to scan PR commit ranges
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Custom rules + allowlists tuned for k-fin
          GITLEAKS_CONFIG: .gitleaks.toml
          # No GITLEAKS_LICENSE — only required for org accounts.

  dependency-audit:
    name: Dependency CVE audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Export locked requirements and run pip-audit
        # Export first so pip-audit never receives a partial dependency set.
        # `uvx` runs pip-audit in an isolated environment without adding it to
        # uv.lock. Any setup, export, bootstrap, or audit failure is blocking.
        run: |
          set -euo pipefail
          uv export --format requirements-txt --no-emit-project > "${RUNNER_TEMP}/requirements.txt"
          uvx pip-audit -r "${RUNNER_TEMP}/requirements.txt"
