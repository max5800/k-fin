name: Release

on:
  push:
    branches:
      - main
      - develop

# Serialise releases per branch so a re-run can't race the prior one
# at the `:latest` image push. We do not
# cancel-in-progress: an in-flight semantic-release that has already
# tagged + pushed must finish to keep tag and image consistent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      source_sha: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"

  publish:
    name: Publish Images & Helm Chart
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    outputs:
      api_image: ghcr.io/max5800/k-fin-api:v${{ needs.release.outputs.version }}
      api_digest: ${{ steps.build-api.outputs.digest }}
      worker_image: ghcr.io/max5800/k-fin-worker:v${{ needs.release.outputs.version }}
      worker_digest: ${{ steps.build-worker.outputs.digest }}
      chart: oci://ghcr.io/max5800/helm-charts/k-fin:${{ needs.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tags
        run: |
          {
            echo "api<<EOF"
            echo "ghcr.io/max5800/k-fin-api:v${{ needs.release.outputs.version }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "ghcr.io/max5800/k-fin-api:latest"
            fi
            echo "EOF"
            echo "worker<<EOF"
            echo "ghcr.io/max5800/k-fin-worker:v${{ needs.release.outputs.version }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "ghcr.io/max5800/k-fin-worker:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.image-tags.outputs.api }}

      - name: Build and push Worker image
        id: build-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.worker }}

      - name: Helm registry login
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: helm package chart/ --version ${{ needs.release.outputs.version }} --app-version ${{ needs.release.outputs.version }}

      - name: Push Helm chart
        run: helm push k-fin-${{ needs.release.outputs.version }}.tgz oci://ghcr.io/max5800/helm-charts

      - name: Record immutable release evidence
        run: |
          {
            echo "## k-fin release evidence"
            echo "- version: v${{ needs.release.outputs.version }}"
            echo "- source SHA: ${{ needs.release.outputs.source_sha }}"
            echo "- API image: ghcr.io/max5800/k-fin-api:v${{ needs.release.outputs.version }}@${{ steps.build-api.outputs.digest }}"
            echo "- worker image: ghcr.io/max5800/k-fin-worker:v${{ needs.release.outputs.version }}@${{ steps.build-worker.outputs.digest }}"
            echo "- chart: oci://ghcr.io/max5800/helm-charts/k-fin:${{ needs.release.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
