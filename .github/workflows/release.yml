name: Release

on:
  push:
    branches:
      - main
      - develop

# Serialise releases per branch so a re-run can't race the prior one
# at the `:latest` image push or the Fleet bundle commit. We do not
# cancel-in-progress: an in-flight semantic-release that has already
# tagged + pushed must finish to keep tag and image consistent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"

  publish:
    name: Publish Images & Helm Chart
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tags
        run: |
          {
            echo "api<<EOF"
            echo "ghcr.io/max5800/k-fin-api:v${{ needs.release.outputs.version }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "ghcr.io/max5800/k-fin-api:latest"
            fi
            echo "EOF"
            echo "worker<<EOF"
            echo "ghcr.io/max5800/k-fin-worker:v${{ needs.release.outputs.version }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "ghcr.io/max5800/k-fin-worker:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.image-tags.outputs.api }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.worker }}

      - name: Helm registry login
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: helm package chart/ --version ${{ needs.release.outputs.version }} --app-version ${{ needs.release.outputs.version }}

      - name: Push Helm chart
        run: helm push k-fin-${{ needs.release.outputs.version }}.tgz oci://ghcr.io/max5800/helm-charts

  update-fleet:
    name: Prepare protected Fleet delivery
    needs: [release, publish]
    # Prepares a candidate for protected delivery, never a default-branch update.
    if: needs.release.outputs.published == 'true' && github.ref == 'refs/heads/main' && github.repository_owner == 'max5800'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout k-fin handoff helper
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Open Fleet pin draft PR
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          HOME_LAB_PAT: ${{ secrets.HOME_LAB_PAT }}
        run: python3 scripts/fleet_handoff.py

      - name: Preserve protected-delivery handoff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: fleet-handoff.json
          if-no-files-found: error
          retention-days: 30
