name: Release

on:
  push:
    branches:
      - main
      - develop

# Serialise releases per branch so a re-run can't race the prior one
# at the `:latest` image push or the Fleet bundle commit. We do not
# cancel-in-progress: an in-flight semantic-release that has already
# tagged + pushed must finish to keep tag and image consistent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"

  publish:
    name: Publish Images & Helm Chart
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tags
        run: |
          {
            echo "api<<EOF"
            echo "ghcr.io/max5800/k-fin-api:v${{ needs.release.outputs.version }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "ghcr.io/max5800/k-fin-api:latest"
            fi
            echo "EOF"
            echo "worker<<EOF"
            echo "ghcr.io/max5800/k-fin-worker:v${{ needs.release.outputs.version }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "ghcr.io/max5800/k-fin-worker:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.image-tags.outputs.api }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.worker }}

      - name: Helm registry login
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: helm package chart/ --version ${{ needs.release.outputs.version }} --app-version ${{ needs.release.outputs.version }}

      - name: Push Helm chart
        run: helm push k-fin-${{ needs.release.outputs.version }}.tgz oci://ghcr.io/max5800/helm-charts

  update-fleet:
    name: Pin Fleet version
    needs: [release, publish]
    # Homelab-only step. Skipped on forks because the target repo and the
    # HOME_LAB_PAT secret only exist for max5800.
    if: needs.release.outputs.published == 'true' && github.ref == 'refs/heads/main' && github.repository_owner == 'max5800'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout home-lab
        uses: actions/checkout@v7
        with:
          repository: max5800/home-lab
          token: ${{ secrets.HOME_LAB_PAT }}

      - name: Bump k-fin chart version in Fleet bundle
        run: |
          yq e '.helm.version = "${{ needs.release.outputs.version }}"' -i \
            kubernetes/apps/k-fin/app/fleet.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/apps/k-fin/app/fleet.yaml
          git commit -m "chore(release): bump k-fin to v${{ needs.release.outputs.version }}"
          git push
