api:
  image:
    pullPolicy: Always
  command: ["uvicorn", "src.api.serve_exports:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    APP_ENV: "development"
    LOG_LEVEL: "DEBUG"
    EXPORTS_DIR: "/data/exports"

worker:
  image:
    pullPolicy: Always
  command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    EXPORTS_DIR: "/data/exports"
    SYNC_INTERVAL_MINUTES: "5"

ingress:
  enabled: true
  className: traefik
  host: k-fin.local

externalSecret:
  enabled: false

postgres:
  enabled: true
  instances: 1
  db: finance
  owner: finance
  credentialsSecret: k-fin-postgres-credentials
  persistence:
    size: 2Gi
  backup:
    enabled: false
  externalSecret:
    enabled: false
  migrate:
    image:
      repository: ghcr.io/max5800/k-fin-migrate
      pullPolicy: IfNotPresent
