api:
  image:
    pullPolicy: Always
  command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    APP_ENV: "development"
    LOG_LEVEL: "DEBUG"
    EXPORTS_DIR: "/data/exports"

worker:
  image:
    pullPolicy: Always
  command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    EXPORTS_DIR: "/data/exports"
    SYNC_INTERVAL_MINUTES: "5"

ui:
  enabled: true
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
  env:
    VITE_API_BASE_URL: "/api/v1"
    # Port-forwarded local dev: browser is at localhost:3000, so HMR
    # connects straight back to 3000 (Vite default) — no override needed.

ingress:
  enabled: true
  className: traefik
  host: k-fin-dev.local

externalSecret:
  enabled: false

postgres:
  enabled: true
  instances: 1
  db: finance
  owner: finance
  credentialsSecret: k-fin-postgres-credentials
  persistence:
    size: 2Gi
  backup:
    enabled: false
  externalSecret:
    enabled: false
  migrate:
    image:
      repository: ghcr.io/max5800/k-fin-migrate
      pullPolicy: IfNotPresent
