imagePullSecrets:
  - name: ghcr-pull-secret

api:
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    APP_ENV: "production"
    LOG_LEVEL: "INFO"
    EXPORTS_DIR: "/data/exports"

worker:
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    EXPORTS_DIR: "/data/exports"
    SYNC_INTERVAL_MINUTES: "60"

ingress:
  enabled: true
  className: traefik
  host: k-fin-dev.max5800.com

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStore:
    name: vault-finance
    kind: SecretStore
  vaultPath: k8s/finance-api
  keys:
    - path: finance/comdirect
      vaultKey: COMDIRECT_CLIENT_ID
      envVar: COMDIRECT_CLIENT_ID
    - path: finance/comdirect
      vaultKey: COMDIRECT_CLIENT_SECRET
      envVar: COMDIRECT_CLIENT_SECRET
    - path: finance/comdirect
      vaultKey: COMDIRECT_USERNAME
      envVar: COMDIRECT_USERNAME
    - path: finance/comdirect
      vaultKey: COMDIRECT_PIN
      envVar: COMDIRECT_PIN
  infraSecrets:
    secretStore:
      name: vault-backend
      kind: ClusterSecretStore
    keys:
      - path: k8s/finance-api
        vaultKey: API_TOKEN
        envVar: API_TOKEN
      - path: k8s/finance-api
        vaultKey: ANTHROPIC_API_KEY
        envVar: ANTHROPIC_API_KEY

postgres:
  enabled: true
  instances: 1
  db: finance
  owner: finance
  credentialsSecret: k-fin-dev-postgres-credentials
  persistence:
    size: 5Gi
  backup:
    enabled: false
  externalSecret:
    enabled: true
    refreshInterval: 1h
    secretStore:
      name: vault-backend
      kind: ClusterSecretStore
    vaultPath: k8s/finance-postgres
