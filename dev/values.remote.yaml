imagePullSecrets:
  - name: ghcr-pull-secret

api:
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    # Dev cluster runs in development mode so the bootstrap login endpoint
    # is reachable. The auth router hard-disables itself when APP_ENV=production.
    APP_ENV: "development"
    LOG_LEVEL: "INFO"
    EXPORTS_DIR: "/data/exports"
    # Bootstrap login — DEV ONLY. Password is sourced from Vault
    # (k8s/finance-api → BOOTSTRAP_PASSWORD) via infraSecrets ESO.
    BOOTSTRAP_LOGIN_ENABLED: "true"
    BOOTSTRAP_EMAIL: "dev@k-fin.local"
    # Origins served by the dev Ingress + local Vite (when pointed at the
    # cluster API). Same-origin requests through the Ingress don't strictly
    # need CORS, but we list the host so cross-origin tooling works too.
    CORS_ORIGINS: "http://k-fin-dev.max5800.com,http://localhost:3000,http://localhost:5173"

worker:
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    EXPORTS_DIR: "/data/exports"
    SYNC_INTERVAL_MINUTES: "60"
    # Worker also mounts the auth router (main.py includes auth.router),
    # so it needs the same dev settings as the api. BOOTSTRAP_PASSWORD
    # is auto-injected via envFrom -> infra-secrets.
    APP_ENV: "development"
    BOOTSTRAP_LOGIN_ENABLED: "true"
    BOOTSTRAP_EMAIL: "dev@k-fin.local"
    CORS_ORIGINS: "http://k-fin-dev.max5800.com,http://localhost:3000,http://localhost:5173"

ui:
  enabled: true
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
  env:
    VITE_API_BASE_URL: "/api/v1"
    # Ingress serves plain HTTP (TLS disabled) — HMR websocket must
    # negotiate on port 80, otherwise Vite tries the pod's 3000.
    VITE_HMR_CLIENT_PORT: "80"
    # Vite v6 rejects unknown Host headers. Add the Ingress host so
    # requests routed through Traefik aren't answered with 403.
    VITE_ALLOWED_HOSTS: "k-fin-dev.max5800.com"

ingress:
  enabled: true
  className: traefik
  host: k-fin-dev.max5800.com

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStore:
    name: vault-finance
    kind: SecretStore
  vaultPath: k8s/finance-api
  keys:
    - path: finance/comdirect
      vaultKey: COMDIRECT_CLIENT_ID
      envVar: COMDIRECT_CLIENT_ID
    - path: finance/comdirect
      vaultKey: COMDIRECT_CLIENT_SECRET
      envVar: COMDIRECT_CLIENT_SECRET
    - path: finance/comdirect
      vaultKey: COMDIRECT_USERNAME
      envVar: COMDIRECT_USERNAME
    - path: finance/comdirect
      vaultKey: COMDIRECT_PIN
      envVar: COMDIRECT_PIN
  infraSecrets:
    secretStore:
      name: vault-backend
      kind: ClusterSecretStore
    keys:
      - path: k8s/finance-api
        vaultKey: API_TOKEN
        envVar: API_TOKEN
      - path: k8s/finance-api
        vaultKey: ANTHROPIC_API_KEY
        envVar: ANTHROPIC_API_KEY
      # DEV ONLY — bootstrap login password (unlocks API_TOKEN via
      # /api/v1/auth/login). Write the value to Vault before the first
      # `tilt up`, otherwise the endpoint will 500 with "misconfigured":
      #   vault kv put secret/k8s/finance-api BOOTSTRAP_PASSWORD=<dev-password>
      # (preserve the existing API_TOKEN / ANTHROPIC_API_KEY keys — use
      # `vault kv patch` if your Vault version supports it.)
      - path: k8s/finance-api
        vaultKey: BOOTSTRAP_PASSWORD
        envVar: BOOTSTRAP_PASSWORD

postgres:
  enabled: true
  instances: 1
  db: finance
  owner: finance
  credentialsSecret: k-fin-dev-postgres-credentials
  persistence:
    size: 5Gi
  backup:
    enabled: false
  externalSecret:
    enabled: true
    refreshInterval: 1h
    secretStore:
      name: vault-backend
      kind: ClusterSecretStore
    vaultPath: k8s/finance-postgres
