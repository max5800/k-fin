api:
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    APP_ENV: "production"
    LOG_LEVEL: "INFO"
    EXPORTS_DIR: "/data/exports"

worker:
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    EXPORTS_DIR: "/data/exports"
    SYNC_INTERVAL_MINUTES: "60"
    FIREFLY_BASE_URL: "http://firefly-iii:8080"

ingress:
  enabled: true
  className: traefik
  host: comdirect-sync.max5800.com

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore
  vaultPath: secret/data/k8s/finance-api
