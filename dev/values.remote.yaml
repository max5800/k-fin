api:
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    APP_ENV: "production"
    LOG_LEVEL: "INFO"
    EXPORTS_DIR: "/data/exports"

worker:
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    EXPORTS_DIR: "/data/exports"
    SYNC_INTERVAL_MINUTES: "60"
    FIREFLY_BASE_URL: "http://firefly-iii:8080"

ingress:
  enabled: true
  className: traefik
  host: comdirect-sync.max5800.com

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore
  vaultPath: k8s/finance-api
  keys:
    - path: finance/comdirect
      vaultKey: comdirect-client-id
      envVar: COMDIRECT_CLIENT_ID
    - path: finance/comdirect
      vaultKey: comdirect-client-secret
      envVar: COMDIRECT_CLIENT_SECRET
    - path: finance/comdirect
      vaultKey: comdirect-username
      envVar: COMDIRECT_USERNAME
    - path: finance/comdirect
      vaultKey: comdirect-pin
      envVar: COMDIRECT_PIN
    - path: k8s/finance-api
      vaultKey: API_TOKEN
      envVar: API_TOKEN
