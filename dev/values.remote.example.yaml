## Example dev values for the remote k3s-app cluster.
##
## Copy this file to `dev/values.local.yaml` and fill in your own host,
## CORS origins, Vault paths, etc. `values.local.yaml` is git-ignored —
## the Tiltfile and the standalone helm command both read from it.
##
## Quick start:
##   cp dev/values.remote.example.yaml dev/values.local.yaml
##   $EDITOR dev/values.local.yaml          # set your INGRESS_HOST etc.
##   tilt up --stream

imagePullSecrets:
  - name: ghcr-pull-secret

api:
  image:
    pullPolicy: Always
  # Dev-only: allow Tilt live_update to write synced files into /app.
  # Production keeps readOnlyRootFilesystem=true (chart/values.yaml default).
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    APP_ENV: "production"
    LOG_LEVEL: "INFO"
    EXPORTS_DIR: "/data/exports"
    # M10a real auth. JWT_SECRET + bootstrap user credentials come from
    # Vault via infraSecrets ESO. Display name is static.
    BOOTSTRAP_USER_DISPLAY_NAME: "Your Name"
    CORS_ORIGINS: "http://k-fin-dev.example.com,http://localhost:3000,http://localhost:5173"

worker:
  image:
    pullPolicy: Always
  # Dev-only: allow Tilt live_update to write synced files into /app.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    EXPORTS_DIR: "/data/exports"
    SYNC_INTERVAL_MINUTES: "60"
    APP_ENV: "production"
    # Worker mounts the same auth router — JWT_SECRET injected via ESO.
    BOOTSTRAP_USER_DISPLAY_NAME: "Your Name"
    CORS_ORIGINS: "http://k-fin-dev.example.com,http://localhost:3000,http://localhost:5173"

ui:
  enabled: true
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
  env:
    VITE_API_BASE_URL: "/api/v1"
    # Ingress serves plain HTTP (TLS disabled) — HMR websocket must
    # negotiate on port 80, otherwise Vite tries the pod's 3000.
    VITE_HMR_CLIENT_PORT: "80"
    # Vite v6 rejects unknown Host headers. Add the Ingress host so
    # requests routed through Traefik aren't answered with 403.
    VITE_ALLOWED_HOSTS: "k-fin-dev.example.com"

ingress:
  enabled: true
  className: traefik
  host: k-fin-dev.example.com

externalSecret:
  enabled: true
  refreshInterval: 5m
  secretStore:
    name: vault-finance
    kind: SecretStore
  vaultPath: k8s/finance-api
  keys:
    - path: finance/comdirect
      vaultKey: COMDIRECT_CLIENT_ID
      envVar: COMDIRECT_CLIENT_ID
    - path: finance/comdirect
      vaultKey: COMDIRECT_CLIENT_SECRET
      envVar: COMDIRECT_CLIENT_SECRET
    - path: finance/comdirect
      vaultKey: COMDIRECT_USERNAME
      envVar: COMDIRECT_USERNAME
    - path: finance/comdirect
      vaultKey: COMDIRECT_PIN
      envVar: COMDIRECT_PIN
  infraSecrets:
    secretStore:
      name: vault-backend
      kind: ClusterSecretStore
    keys:
      - path: k8s/finance-api
        vaultKey: API_TOKEN
        envVar: API_TOKEN
      - path: k8s/finance-api
        vaultKey: ANTHROPIC_API_KEY
        envVar: ANTHROPIC_API_KEY
      # M10a real auth secrets — write these to Vault before the first
      # `tilt up` (vault kv patch secret/k8s/finance-api ...):
      #   JWT_SECRET              — random 32+ char string
      #   BOOTSTRAP_USER_EMAIL    — your login email
      #   BOOTSTRAP_USER_INITIAL_PASSWORD — temp password (min 12 chars);
      #     only used once by the migration to seed the users table
      - path: k8s/finance-api
        vaultKey: JWT_SECRET
        envVar: JWT_SECRET
      - path: k8s/finance-api
        vaultKey: BOOTSTRAP_USER_EMAIL
        envVar: BOOTSTRAP_USER_EMAIL
      - path: k8s/finance-api
        vaultKey: BOOTSTRAP_USER_INITIAL_PASSWORD
        envVar: BOOTSTRAP_USER_INITIAL_PASSWORD

postgres:
  enabled: true
  instances: 1
  db: finance
  owner: finance
  credentialsSecret: k-fin-dev-postgres-credentials
  persistence:
    size: 5Gi
  backup:
    enabled: false
  externalSecret:
    enabled: true
    refreshInterval: 5m
    secretStore:
      name: vault-backend
      kind: ClusterSecretStore
    vaultPath: k8s/finance-postgres
